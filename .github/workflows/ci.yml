name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Integrity and workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (JSON validation only)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Structural integrity gate
        run: bash scripts/ci/check-integrity.sh

  backend:
    name: Backend, database and secrets (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure Docker API for Testcontainers
        run: |
          set -euo pipefail
          api_version="$(docker version --format '{{.Server.APIVersion}}')"
          echo "Docker server API: ${api_version}"
          existing="${JAVA_TOOL_OPTIONS:-}"
          echo "JAVA_TOOL_OPTIONS=${existing:+$existing }-Dapi.version=${api_version}" >> "$GITHUB_ENV"
      - name: Build and test (Testcontainers, Flyway, secrets scan)
        working-directory: backend
        run: mvn -B clean verify
      - name: Assert critical suites really ran
        run: python3 scripts/ci/assert-surefire.py
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend (Vitest, TypeScript, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from lockfile
        working-directory: frontend
        run: npm ci
      - name: Frontend/backend contract compatibility
        working-directory: frontend
        run: node ../scripts/contracts/check_frontend_contracts.cjs
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build

  api-contract:
    name: API contract snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure Docker API for Testcontainers
        run: |
          set -euo pipefail
          api_version="$(docker version --format '{{.Server.APIVersion}}')"
          echo "Docker server API: ${api_version}"
          existing="${JAVA_TOOL_OPTIONS:-}"
          echo "JAVA_TOOL_OPTIONS=${existing:+$existing }-Dapi.version=${api_version}" >> "$GITHUB_ENV"
      - name: Capture exposed OpenAPI document
        working-directory: backend
        run: mvn -B -Dtest=OpenApiSnapshotIntegrationTest test
      - name: Assert OpenAPI capture ran
        run: python3 scripts/ci/assert-openapi-capture.py
      - name: Compare against versioned snapshot
        run: python3 scripts/contracts/check_openapi_contract.py --report contract-report/openapi-report.txt
      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract-report
          path: contract-report
          if-no-files-found: warn
          retention-days: 7

  security-integration:
    name: Ownership and ADMIN integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure Docker API for Testcontainers
        run: |
          set -euo pipefail
          api_version="$(docker version --format '{{.Server.APIVersion}}')"
          echo "Docker server API: ${api_version}"
          existing="${JAVA_TOOL_OPTIONS:-}"
          echo "JAVA_TOOL_OPTIONS=${existing:+$existing }-Dapi.version=${api_version}" >> "$GITHUB_ENV"
      - name: Run ownership, authorization and extended flows
        working-directory: backend
        run: mvn -B -Dtest=OwnershipSecurityIntegrationTest,VideoAdminIntegrationTest,ExtendedIntegrationTest test
      - name: Assert security suites really ran
        run: python3 scripts/ci/assert-security-surefire.py
      - name: Upload security surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-surefire
          path: backend/target/surefire-reports
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: End-to-end (Playwright + local backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from lockfile
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Pre-compile backend
        working-directory: backend
        run: mvn -B -DskipTests compile
      - name: Run E2E journeys
        working-directory: frontend
        env:
          CI: "true"
          E2E_API_URL: http://127.0.0.1:18081
        run: npm run e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  security:
    name: Security (production dependency audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from lockfile
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  overall:
    name: Overall gate
    needs:
      - integrity
      - backend
      - frontend
      - api-contract
      - security-integration
      - e2e
      - security
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all mandatory gates
        env:
          INTEGRITY: ${{ needs.integrity.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          API_CONTRACT: ${{ needs.api-contract.result }}
          SECURITY_INTEGRATION: ${{ needs.security-integration.result }}
          E2E: ${{ needs.e2e.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "integrity:${INTEGRITY}" \
            "backend:${BACKEND}" \
            "frontend:${FRONTEND}" \
            "api-contract:${API_CONTRACT}" \
            "security-integration:${SECURITY_INTEGRATION}" \
            "e2e:${E2E}" \
            "security:${SECURITY}"; do
            name="${item%%:*}"
            result="${item#*:}"
            echo "${name}=${result}"
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "OVERALL GATE: FAIL"
            exit 1
          fi
          echo "OVERALL GATE: PASS"
