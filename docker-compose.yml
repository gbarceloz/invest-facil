# Ambiente local completo (opcional): Postgres + API.
# O frontend roda fora do compose (npm run dev) para facilitar o hot reload.
#
# Uso:
#   $env:JWT_SECRET = "<base64 de 48 bytes>"
#   $env:DEMO_PASSWORD = "<senha local da conta demo>"
#   docker compose up --build
#   cd frontend; $env:API_PROXY_TARGET="http://localhost:8081"; npm run dev

services:
  db:
    image: postgres:17-alpine
    container_name: investfacil-db-compose
    environment:
      POSTGRES_DB: investfacil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investfacil"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - investfacil_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: investfacil-api-compose
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/investfacil
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: local
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      FRONTEND_BASE_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_DEMO_ENABLED: "true"
      DEMO_EMAIL: marina@investfacil.local
      DEMO_PASSWORD: ${DEMO_PASSWORD:?defina DEMO_PASSWORD}
      DEMO_NAME: Marina Lima
      MAIL_ENABLED: "false"
      MARKET_ENABLED: "true"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  investfacil_pgdata:
