# Blueprint do Render para o backend.
# Frontend: Vercel (recomendado) com API_PROXY_TARGET apontando para este serviço.
services:
  - type: web
    name: investfacil-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_FLYWAY_URL
        sync: false
      - key: SPRING_FLYWAY_USER
        sync: false
      - key: SPRING_FLYWAY_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: investfacil-api
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: Strict
      - key: EXPOSE_DEV_TOKENS
        value: "false"
      - key: MAIL_ENABLED
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_VIDEO_BUCKET
        value: videos
      - key: APP_MFA_KEY
        generateValue: true
      - key: APP_DEMO_ENABLED
        value: "false"
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      # Só habilite com IPs reais do proxy. Sem isso, o rate limit compartilha
      # o IP do edge do Render (o lockout por conta continua ativo).
      - key: TRUST_PROXY
        value: "false"
      - key: TRUSTED_PROXIES
        value: ""
      - key: MARKET_ENABLED
        value: "true"
      - key: SEED_CONTENT
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
